<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#efe9dc">
<title>高校入試カウントダウン</title>

<!-- さっきのサムネイルをそのまま使用 -->
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">

<style>
:root{
  --paper:#efe9dc;
  --ink:#171717;
  --muted:#5d5a54;
  --blue:#477f9a;
  --yellow:#d9a70e;
  --red:#df4b27;
  --line:rgba(23,23,23,.72);
}
*{box-sizing:border-box}
html,body{
  margin:0;width:100%;height:100%;overflow:hidden;
  background:var(--paper);color:var(--ink);
}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",
  "Hiragino Sans","Yu Gothic",sans-serif;
}
.page{
  width:100vw;height:100vh;
  padding:max(24px,env(safe-area-inset-top))
          max(38px,env(safe-area-inset-right))
          max(24px,env(safe-area-inset-bottom))
          max(38px,env(safe-area-inset-left));
  display:grid;
  grid-template-rows:auto 1fr auto auto;
  gap:0;
}
.top{
  display:grid;
  grid-template-columns:auto 1fr auto;
  align-items:center;
  gap:20px;
}
.entrance{
  font-size:clamp(16px,2vw,30px);
  letter-spacing:.30em;
  white-space:nowrap;
}
.topline{height:1px;background:var(--ink)}
.today{
  display:flex;align-items:baseline;gap:12px;white-space:nowrap;
}
.today b{
  font-size:clamp(10px,.9vw,14px);letter-spacing:.28em;
}
.today span{
  font-size:clamp(11px,1.2vw,18px);letter-spacing:.12em;font-weight:650;
}
.hero{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:0;
}
h1{
  margin:.6vh 0 .4vh;
  font-size:clamp(48px,6vw,92px);
  line-height:1;
  letter-spacing:.03em;
}
.daysrow{
  display:flex;align-items:center;justify-content:center;gap:2vw;
}
.digits{
  display:flex;
  font-size:clamp(180px,24vw,390px);
  line-height:.78;font-weight:850;letter-spacing:-.085em;
  font-variant-numeric:tabular-nums;
}
.digits span:nth-child(1){color:var(--blue)}
.digits span:nth-child(2){color:var(--yellow)}
.digits span:nth-child(3){color:var(--red)}
.dayslabel{
  font-size:clamp(25px,3vw,50px);
  font-weight:800;letter-spacing:.22em;
}
.timer{
  margin-top:1vh;
  display:flex;align-items:flex-start;justify-content:center;
}
.tunit{text-align:center;min-width:140px}
.tnum{
  font-size:clamp(38px,4.4vw,70px);
  font-weight:800;line-height:1;
  font-variant-numeric:tabular-nums;
}
.tlabel{
  margin-top:7px;font-size:clamp(8px,.75vw,12px);
  letter-spacing:.35em;font-weight:750;
}
.colon{
  font-size:clamp(36px,4vw,64px);
  line-height:.85;padding:0 12px;
}
.examdate{
  margin-top:1.6vh;
  font-size:clamp(13px,1.4vw,21px);
  letter-spacing:.20em;font-weight:650;
}
.nextExam{
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
  display:grid;grid-template-columns:1fr 1px .85fr;
  align-items:center;
  padding:1.7vh 1.5vw;
  min-height:125px;
}
.vertical{width:1px;height:75%;background:var(--line);justify-self:center}
.kicker{
  font-size:clamp(10px,.9vw,14px);
  letter-spacing:.34em;font-weight:800;
}
.nextName{
  margin-top:7px;
  font-size:clamp(27px,3.1vw,48px);
  font-weight:800;line-height:1.1;
}
.smallDate{
  margin-top:8px;
  font-size:clamp(11px,1.15vw,17px);
  letter-spacing:.16em;font-weight:650;
}
.nextRight{
  display:flex;align-items:center;justify-content:flex-end;gap:1.4vw;
}
.nextDays{
  color:var(--red);
  font-size:clamp(78px,9vw,145px);
  line-height:.75;font-weight:850;
  letter-spacing:-.05em;font-variant-numeric:tabular-nums;
}
.nextDaysLabel{
  font-size:clamp(18px,2vw,32px);
  font-weight:800;letter-spacing:.20em;
}
.bottom{
  display:grid;grid-template-columns:1fr 1px 1fr;
  align-items:stretch;
  min-height:112px;
}
.info{
  padding:1.7vh 1.5vw .8vh;
}
.info.school{padding-left:3.6vw}
.infoTitle{
  margin-top:7px;
  font-size:clamp(22px,2.5vw,38px);
  font-weight:800;line-height:1.1;
}
.infoDateRow{
  margin-top:10px;display:flex;align-items:center;gap:14px;
}
.calendar{
  width:32px;height:32px;border:4px solid currentColor;border-radius:3px;
  position:relative;flex:0 0 auto;
}
.calendar:before{
  content:"";position:absolute;left:-4px;right:-4px;top:6px;
  border-top:4px solid currentColor;
}
.calendar:after{
  content:"";position:absolute;left:6px;top:-8px;width:4px;height:8px;
  background:currentColor;box-shadow:12px 0 0 currentColor;
}
.career .calendar{color:var(--blue)}
.school .calendar{color:var(--yellow)}
.infoDate{
  font-size:clamp(11px,1.15vw,17px);
  letter-spacing:.13em;font-weight:650;
}
@media(max-width:850px) and (orientation:portrait){
  .page{padding-left:24px;padding-right:24px}
  .top{grid-template-columns:1fr auto}.topline{display:none}
  .digits{font-size:clamp(155px,31vw,290px)}
  .tunit{min-width:90px}
  .nextExam{grid-template-columns:1fr}
  .nextExam .vertical{display:none}
  .nextRight{justify-content:flex-start;margin-top:12px}
  .bottom{grid-template-columns:1fr}
  .bottom>.vertical{display:none}
  .info.school{padding-left:1.5vw}
}
</style>
</head>

<body>
<div class="page">
  <header class="top">
    <div class="entrance">ENTRANCE EXAMINATION</div>
    <div class="topline"></div>
    <div class="today"><b>TODAY</b><span id="today">----</span></div>
  </header>

  <main class="hero">
    <h1>高校入試まで</h1>

    <div class="daysrow">
      <div class="digits" id="mainDays">
        <span>0</span><span>0</span><span>0</span>
      </div>
      <div class="dayslabel">DAYS</div>
    </div>

    <div class="timer">
      <div class="tunit"><div class="tnum" id="hours">00</div><div class="tlabel">HOURS</div></div>
      <div class="colon">:</div>
      <div class="tunit"><div class="tnum" id="minutes">00</div><div class="tlabel">MINUTES</div></div>
      <div class="colon">:</div>
      <div class="tunit"><div class="tnum" id="seconds">00</div><div class="tlabel">SECONDS</div></div>
    </div>

    <div class="examdate">2027年3月9日（火）　8:30</div>
  </main>

  <section class="nextExam">
    <div>
      <div class="kicker">NEXT EXAM IS …</div>
      <div class="nextName" id="nextExamName">---</div>
      <div class="smallDate" id="nextExamDate">---</div>
    </div>
    <div class="vertical"></div>
    <div class="nextRight">
      <div class="nextDays" id="nextExamDays">--</div>
      <div class="nextDaysLabel">DAYS</div>
    </div>
  </section>

  <section class="bottom">
    <div class="info career">
      <div class="kicker">NEXT CAREER</div>
      <div class="infoTitle" id="careerName">---</div>
      <div class="infoDateRow">
        <div class="calendar"></div>
        <div class="infoDate" id="careerDate">---</div>
      </div>
    </div>

    <div class="vertical"></div>

    <div class="info school">
      <div class="kicker">SCHOOL EVENT</div>
      <div class="infoTitle" id="schoolName">---</div>
      <div class="infoDateRow">
        <div class="calendar"></div>
        <div class="infoDate" id="schoolDate">---</div>
      </div>
    </div>
  </section>
</div>

<script>
(() => {
  const JST = "+09:00";
  const entrance = Date.parse("2027-03-09T08:30:00+09:00");

  // 第6回実力テストは「12月上旬」で日付未確定のため、
  // 正確なカウントダウンには入れていません。日付決定後に追加できます。
  const exams = [
    ["第1回基礎学力テスト","2026-10-07","08:30"],
    ["第5回実力テスト","2026-10-26","08:30"],
    ["第2回基礎学力テスト","2026-11-11","08:30"],
    ["2学期末テスト","2026-11-24","08:30"],
    ["第3回基礎学力テスト","2027-01-12","08:30"],
    ["第7回実力テスト","2027-01-21","08:30"],
    ["卒業テスト","2027-02-12","08:30"],
    ["直前テスト","2027-02-24","08:30"]
  ];

  const careers = [
    ["高校進学説明会①","2026-10-14"],
    ["高校進学説明会②","2026-10-15"]
    // 日付決定後ここへ追加：
    // ["第3回進路希望調査","2026-10-XX"],
    // ["三者面談（第4回進路希望調査）","2026-XX-XX"],
    // ["三者面談調印（私立・育成型）","2027-XX-XX"],
    // ["三者面談調印・公立願書受付","2027-XX-XX"]
  ];

  const schoolEvents = [
    ["文化祭","2026-09-05"],
    ["代休","2026-09-07"],
    ["遠足（USJ）","2026-10-22"],
    ["臨時休校","2026-10-23"]
    // 日付決定後ここへ追加：
    // ["2学期終業式","2026-XX-XX"],
    // ["3学期始業式","2027-XX-XX"],
    // ["卒業式","2027-XX-XX"]
  ];

  const pad = n => String(n).padStart(2,"0");

  function parseJST(date,time="00:00"){
    return Date.parse(`${date}T${time}:00${JST}`);
  }

  function parts(diff){
    const s=Math.max(0,Math.floor(diff/1000));
    return {
      d:Math.floor(s/86400),
      h:Math.floor((s%86400)/3600),
      m:Math.floor((s%3600)/60),
      s:s%60
    };
  }

  function weekday(date){
    const d=new Date(`${date}T12:00:00+09:00`);
    return ["日","月","火","水","木","金","土"][d.getDay()];
  }

  function jpDate(date){
    const [y,m,d]=date.split("-").map(Number);
    return `${y}年${m}月${d}日（${weekday(date)}）`;
  }

  function todayKey(){
    const parts=new Intl.DateTimeFormat("en-CA",{
      timeZone:"Asia/Tokyo",year:"numeric",month:"2-digit",day:"2-digit"
    }).formatToParts(new Date());
    const o={};
    parts.forEach(x=>o[x.type]=x.value);
    return `${o.year}-${o.month}-${o.day}`;
  }

  function nextTimed(list, now){
    return list
      .map(x=>({name:x[0],date:x[1],time:x[2],ts:parseJST(x[1],x[2])}))
      .filter(x=>x.ts>=now)
      .sort((a,b)=>a.ts-b.ts)[0];
  }

  function nextDated(list){
    const today=todayKey();
    return list
      .map(x=>({name:x[0],date:x[1]}))
      .filter(x=>x.date>=today)
      .sort((a,b)=>a.date.localeCompare(b.date))[0];
  }

  function setThreeDigits(n){
    const s=String(Math.max(0,n)).padStart(3,"0").slice(-3);
    document.querySelectorAll("#mainDays span").forEach((el,i)=>el.textContent=s[i]);
  }

  function tick(){
    const now=Date.now();
    const p=parts(entrance-now);

    setThreeDigits(p.d);
    document.getElementById("hours").textContent=pad(p.h);
    document.getElementById("minutes").textContent=pad(p.m);
    document.getElementById("seconds").textContent=pad(p.s);

    document.getElementById("today").textContent=jpDate(todayKey());

    const ex=nextTimed(exams,now);
    if(ex){
      document.getElementById("nextExamName").textContent=`${ex.name}まで`;
      document.getElementById("nextExamDate").textContent=jpDate(ex.date);
      document.getElementById("nextExamDays").textContent=parts(ex.ts-now).d;
    }else{
      document.getElementById("nextExamName").textContent="高校入試";
      document.getElementById("nextExamDate").textContent="2027年3月9日（火）";
      document.getElementById("nextExamDays").textContent=parts(entrance-now).d;
    }

    const career=nextDated(careers);
    document.getElementById("careerName").textContent=career ? career.name : "日程未定";
    document.getElementById("careerDate").textContent=career ? jpDate(career.date) : "—";

    const school=nextDated(schoolEvents);
    document.getElementById("schoolName").textContent=school ? school.name : "日程未定";
    document.getElementById("schoolDate").textContent=school ? jpDate(school.date) : "—";
  }

  tick();
  setInterval(tick,1000);
})();
</script>
</body>
</html>
