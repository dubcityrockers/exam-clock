<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#e9e5d8">
<title>Exam Year Clock</title>
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png"> 
<style>
:root{--paper:#e9e5d8;--ink:#151512;--muted:#68665f;--red:#b43b30;--line:rgba(21,21,18,.30)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink)}
body{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Hiragino Sans","Yu Gothic",sans-serif}
.wrap{min-height:100vh;padding:max(20px,env(safe-area-inset-top)) max(24px,env(safe-area-inset-right)) max(20px,env(safe-area-inset-bottom)) max(24px,env(safe-area-inset-left));display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px}
.brand{font-size:11px;letter-spacing:.22em;font-weight:800}.red{color:var(--red)}
.nowdate{font-size:12px;font-weight:700;color:var(--muted);text-align:right}
.hero{margin-top:7vh}.kicker,.tag{font-size:10px;letter-spacing:.19em;font-weight:800;color:var(--muted)}
.title{margin-top:6px;font-size:clamp(24px,3.3vw,44px);font-weight:850}
.hero-count{margin-top:18px;display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px 22px}
.days{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;font-variant-numeric:tabular-nums;font-size:clamp(78px,13vw,148px);line-height:.86;font-weight:800;letter-spacing:-.08em}
.hero-side{padding-bottom:8px}.hero-side .label{font-size:11px;letter-spacing:.2em;font-weight:900;color:var(--red)}
.rest{margin-top:4px;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;font-size:clamp(18px,2.2vw,28px);font-weight:800;font-variant-numeric:tabular-nums}
.rule{height:4px;background:var(--ink);margin-top:24px}
.targetrow{margin-top:8px;display:flex;justify-content:space-between;gap:16px;font-size:12px;font-weight:700;color:var(--muted)}
.next-exam{margin-top:34px;border-top:1px solid var(--line);padding-top:12px}
.next-exam-row{margin-top:8px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:end}
.event-name{font-size:clamp(19px,2.6vw,30px);font-weight:850}
.event-date{margin-top:5px;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;font-size:13px;font-weight:700;color:var(--muted)}
.until{text-align:right}.until-value{margin-top:3px;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;font-variant-numeric:tabular-nums;font-size:clamp(24px,3.4vw,42px);font-weight:800;letter-spacing:-.04em}
.grid{margin-top:30px;display:grid;grid-template-columns:1fr 1fr;gap:28px}
.panel{border-top:1px solid var(--line);padding-top:12px;min-width:0}.panel .event-name{margin-top:8px;font-size:clamp(18px,2.1vw,25px)}
.following{margin-top:18px;padding-top:11px;border-top:1px solid rgba(21,21,18,.15);display:flex;justify-content:space-between;gap:16px;font-size:12px;font-weight:700}
.following .lab{color:var(--muted);letter-spacing:.13em;font-size:10px}
.tba{margin-top:30px;border-top:1px solid var(--line);padding-top:12px}
.tba-grid{margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:8px 30px}
.tba-item{display:flex;justify-content:space-between;gap:14px;font-size:13px;font-weight:700}
.tba-item span:last-child{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;color:var(--muted);white-space:nowrap}
footer{margin-top:auto;padding-top:28px;display:flex;justify-content:space-between;gap:20px;color:var(--muted);font-size:10px;font-weight:800;letter-spacing:.14em}
@media(max-width:700px){.hero{margin-top:48px}.next-exam-row{grid-template-columns:1fr}.until{text-align:left}.grid,.tba-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<header class="top"><div class="brand"><span class="red">●</span> EXAM YEAR CLOCK</div><div class="nowdate" id="nowDate">—</div></header>
<main>
<section class="hero">
<div class="kicker">ENTRANCE EXAMINATION</div>
<div class="title">徳島北高校 入試まで</div>
<div class="hero-count"><div class="days" id="mainDays">—</div><div class="hero-side"><div class="label">DAYS</div><div class="rest" id="mainRest">-- : -- : --</div></div></div>
<div class="rule"></div><div class="targetrow"><span>09 MAR 2027 · 08:30</span><span>JST</span></div>
</section>

<section class="next-exam">
<div class="tag red">● NEXT EXAM IS...</div>
<div class="next-exam-row">
<div><div class="event-name" id="nextExamName">—</div><div class="event-date" id="nextExamDate">—</div></div>
<div class="until"><div class="tag red">UNTIL EXAM</div><div class="until-value" id="nextExamRemain">—</div></div>
</div>
</section>

<section class="grid">
<div class="panel">
<div class="tag">■ NEXT CAREER</div>
<div class="event-name" id="nextCareerName">—</div><div class="event-date" id="nextCareerDate">—</div>
<div class="following"><span class="lab">FOLLOWING</span><span id="nextCareerFollowing">—</span></div>
</div>
<div class="panel">
<div class="tag">○ NEXT SCHOOL EVENT</div>
<div class="event-name" id="nextSchoolName">—</div><div class="event-date" id="nextSchoolDate">—</div>
<div class="following"><span class="lab">FOLLOWING</span><span id="nextSchoolFollowing">—</span></div>
</div>
</section>

<section class="tba"><div class="tag">DATE TO BE ANNOUNCED</div><div class="tba-grid" id="tbaGrid"></div></section>
</main>
<footer><span>TOKUSHIMA · JAPAN</span><span id="status">COUNTING DOWN</span></footer>
</div>

<script>
(() => {
const TZ="Asia/Tokyo";
const entrance=Date.parse("2027-03-09T08:30:00+09:00");

const exams=[
{name:"進級テスト",date:"2026-04-10",time:"08:30"},
{name:"第1回実力テスト",date:"2026-04-27",time:"08:30"},
{name:"第2回実力テスト",date:"2026-06-01",time:"08:30"},
{name:"1学期末テスト",date:"2026-06-22",time:"08:30"},
{name:"第3回実力テスト",date:"2026-07-06",time:"08:30"},
{name:"第4回実力テスト",date:"2026-08-28",time:"08:30"},
{name:"第1回基礎学力テスト",date:"2026-10-07",time:"08:30"},
{name:"第5回実力テスト",date:"2026-10-26",time:"08:30"},
{name:"第2回基礎学力テスト",date:"2026-11-11",time:"08:30"},
{name:"2学期末テスト",date:"2026-11-24",time:"08:30"},
{name:"第6回実力テスト",rough:"2026年12月上旬"},
{name:"第3回基礎学力テスト",date:"2027-01-12",time:"08:30"},
{name:"第7回実力テスト",date:"2027-01-21",time:"08:30"},
{name:"卒業テスト",date:"2027-02-12",time:"08:30"},
{name:"直前テスト",date:"2027-02-24",time:"08:30"},
{name:"高校入試",date:"2027-03-09",time:"08:30"}
];

const events=[
{name:"始業式",date:"2026-04-08",type:"school"},
{name:"授業参観・PTA総会",date:"2026-04-18",type:"school"},
{name:"三者面談",date:"2026-04-20",type:"career"},
{name:"代休",date:"2026-05-01",type:"school"},
{name:"第1回進路希望調査",date:"2026-05-07",type:"career"},
{name:"体育祭",date:"2026-05-15",type:"school"},
{name:"代休",date:"2026-06-15",type:"school"},
{name:"三者面談（第2回進路希望調査）",date:"2026-07-09",type:"career"},
{name:"終業式",date:"2026-07-17",type:"school"},
{name:"PTA奉仕作業",date:"2026-08-16",type:"school"},
{name:"始業式",date:"2026-08-27",type:"school"},
{name:"文化祭",date:"2026-09-05",type:"school"},
{name:"代休",date:"2026-09-07",type:"school"},
{name:"高校進学説明会①",date:"2026-10-14",type:"career"},
{name:"高校進学説明会②",date:"2026-10-15",type:"career"},
{name:"遠足 USJ",date:"2026-10-22",type:"school"},
{name:"臨時休校",date:"2026-10-23",type:"school"},
{name:"第3回進路希望調査",rough:"2026年10月下旬",type:"career"},
{name:"三者面談（第4回進路希望調査）",rough:"DATE TBA",type:"career"},
{name:"2学期終業式",rough:"DATE TBA",type:"school"},
{name:"3学期始業式",rough:"DATE TBA",type:"school"},
{name:"三者面談調印（私立・育成型）",rough:"DATE TBA",type:"career"},
{name:"三者面談調印・公立願書受付",rough:"DATE TBA",type:"career"},
{name:"卒業式",rough:"DATE TBA",type:"school"}
];

const pad=n=>String(n).padStart(2,"0");
const monthEn=["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];

function toMillis(item){
 if(!item.date)return null;
 return Date.parse(`${item.date}T${item.time||"00:00"}:00+09:00`);
}
function formatDate(item){
 if(!item.date)return item.rough||"DATE TBA";
 const [y,m,d]=item.date.split("-").map(Number);
 return `${pad(d)} ${monthEn[m-1]} ${y}${item.time?" · "+item.time:""}`;
}
function parts(diff){
 const total=Math.max(0,Math.floor(diff/1000));
 return {d:Math.floor(total/86400),h:Math.floor((total%86400)/3600),m:Math.floor((total%3600)/60),s:total%60};
}
function nextKnown(list,now){
 return list.filter(x=>x.date&&toMillis(x)>=now).sort((a,b)=>toMillis(a)-toMillis(b));
}
function setEventBlock(prefix,list,now){
 const known=nextKnown(list,now), first=known[0], second=known[1];
 document.getElementById(prefix+"Name").textContent=first?first.name:"予定なし";
 document.getElementById(prefix+"Date").textContent=first?formatDate(first):"—";
 document.getElementById(prefix+"Following").textContent=second?`${second.name} · ${formatDate(second).replace(/ \d{4}/,"")}`:"—";
}
function updateTBA(){
 const tba=[...exams.filter(x=>!x.date),...events.filter(x=>!x.date)];
 const grid=document.getElementById("tbaGrid");
 grid.innerHTML="";
 tba.forEach(item=>{
   const div=document.createElement("div"); div.className="tba-item";
   const a=document.createElement("span"), b=document.createElement("span");
   a.textContent=item.name;
   if(item.rough==="2026年10月下旬")b.textContent="OCT · LATE";
   else if(item.rough==="2026年12月上旬")b.textContent="DEC · EARLY";
   else b.textContent="DATE TBA";
   div.append(a,b);grid.appendChild(div);
 });
}
function tick(){
 const now=Date.now();
 const main=parts(entrance-now);
 document.getElementById("mainDays").textContent=main.d;
 document.getElementById("mainRest").textContent=`${pad(main.h)} : ${pad(main.m)} : ${pad(main.s)}`;

 const examList=nextKnown(exams,now), nextExam=examList[0];
 if(nextExam){
   document.getElementById("nextExamName").textContent=nextExam.name;
   document.getElementById("nextExamDate").textContent=formatDate(nextExam);
   const r=parts(toMillis(nextExam)-now);
   document.getElementById("nextExamRemain").textContent=`${r.d}D ${pad(r.h)}:${pad(r.m)}:${pad(r.s)}`;
 }else{
   document.getElementById("nextExamName").textContent="試験日程終了";
   document.getElementById("nextExamDate").textContent="—";
   document.getElementById("nextExamRemain").textContent="—";
 }

 setEventBlock("nextCareer",events.filter(x=>x.type==="career"),now);
 setEventBlock("nextSchool",events.filter(x=>x.type==="school"),now);

 document.getElementById("nowDate").textContent=
   new Intl.DateTimeFormat("ja-JP",{timeZone:TZ,year:"numeric",month:"2-digit",day:"2-digit",weekday:"short"}).format(new Date()).replaceAll("/",".");
 if(now>=entrance)document.getElementById("status").textContent="EXAM DAY";
}
updateTBA();
tick();
setInterval(tick,1000);
})();
</script>
</body>
</html>
