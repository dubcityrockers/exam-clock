<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#efe9dc">
<title>高校入試カウントダウン</title>

<!-- 以前のサムネイルをそのまま使用 -->
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">

<style>
:root{
  --paper:#f1eee4;
  --ink:#111;
  --blue:#1683d8;
  --yellow:#efc400;
  --red:#ee202d;
  --line:rgba(17,17,17,.58);
}

*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  height:100%;
  background:var(--paper);
}
body{
  overflow:hidden;
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",
  "Hiragino Sans","Yu Gothic",sans-serif;
}

.page{
  width:100vw;
  height:100vh;
  height:100dvh;
  overflow:hidden;
  padding:
    max(12px,env(safe-area-inset-top))
    max(24px,env(safe-area-inset-right))
    max(10px,env(safe-area-inset-bottom))
    max(24px,env(safe-area-inset-left));
  display:grid;
  grid-template-rows:auto minmax(0,1fr) auto auto;
}

/* ===== TOP ===== */
.top{
  display:grid;
  grid-template-columns:auto 1fr auto;
  align-items:center;
  gap:16px;
  min-height:34px;
}
.entrance{
  font-size:clamp(13px,1.6vw,24px);
  letter-spacing:.32em;
  white-space:nowrap;
}
.topline{height:1px;background:var(--ink)}
.today{
  display:flex;
  align-items:baseline;
  gap:10px;
  white-space:nowrap;
  text-decoration:none;
  color:inherit;
  padding:8px 0;
}
.today b{
  font-size:clamp(9px,.7vw,11px);
  letter-spacing:.25em;
}
.today span{
  font-size:clamp(10px,.95vw,15px);
  letter-spacing:.1em;
  font-weight:650;
}

/* ===== HERO ===== */
.hero{
  min-height:0;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:.3vh 0 .8vh;
}
.hero h1{
  margin:0 0 .3vh;
  font-size:clamp(54px,7vw,108px);
  line-height:.95;
  font-weight:850;
  letter-spacing:.01em;
}
.daysrow{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:1.3vw;
  line-height:1;
}
.digits{
  display:flex;
  font-size:clamp(230px,31vw,500px);
  line-height:.70;
  font-weight:900;
  letter-spacing:-.095em;
  font-variant-numeric:tabular-nums;
}
.digits span:nth-child(1){color:var(--blue)}
.digits span:nth-child(2){color:var(--yellow)}
.digits span:nth-child(3){color:var(--red)}
.dayslabel{
  align-self:center;
  margin-top:4vh;
  font-size:clamp(26px,3.3vw,54px);
  font-weight:900;
  letter-spacing:.16em;
}

.timer{
  margin-top:.2vh;
  display:flex;
  justify-content:center;
  align-items:flex-start;
}
.tunit{
  min-width:140px;
  text-align:center;
}
.tnum{
  font-size:clamp(46px,5.8vw,88px);
  line-height:.95;
  font-weight:850;
  font-variant-numeric:tabular-nums;
}
.colon{
  padding:0 16px;
  font-size:clamp(40px,4.5vw,72px);
  line-height:.95;
  font-weight:500;
}
.tlabel{
  margin-top:7px;
  font-size:clamp(8px,.72vw,11px);
  letter-spacing:.38em;
  font-weight:800;
}
.examdate{
  margin-top:1.1vh;
  font-size:clamp(14px,1.45vw,22px);
  letter-spacing:.16em;
  font-weight:650;
}

/* ===== NEXT EXAM ===== */
.nextExam{
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
  display:grid;
  grid-template-columns:1fr 1px .72fr;
  align-items:center;
  padding:.95vh 1vw;
  min-height:92px;
}
.vertical{
  width:1px;
  height:72%;
  background:var(--line);
  justify-self:center;
}
.kicker{
  font-size:clamp(8px,.7vw,11px);
  letter-spacing:.33em;
  font-weight:850;
}
.nextName{
  margin-top:4px;
  font-size:clamp(23px,2.45vw,38px);
  line-height:1.02;
  font-weight:850;
}
.smallDate{
  margin-top:5px;
  font-size:clamp(9px,.9vw,14px);
  letter-spacing:.12em;
  font-weight:650;
}
.nextRight{
  display:flex;
  justify-content:flex-end;
  align-items:center;
  gap:1vw;
}
.nextDays{
  color:var(--red);
  font-size:clamp(66px,8vw,122px);
  line-height:.74;
  font-weight:900;
  letter-spacing:-.05em;
  font-variant-numeric:tabular-nums;
}
.nextDaysLabel{
  font-size:clamp(17px,1.75vw,28px);
  letter-spacing:.18em;
  font-weight:900;
}

/* ===== BOTTOM ===== */
.bottom{
  display:grid;
  grid-template-columns:1fr 1px 1fr;
  align-items:stretch;
  min-height:88px;
}
.info{
  padding:.9vh 1vw .25vh;
  min-width:0;
}
.info.school{padding-left:3.2vw}
.infoTitle{
  margin-top:5px;
  font-size:clamp(19px,2vw,31px);
  line-height:1.05;
  font-weight:850;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.infoDateRow{
  margin-top:7px;
  display:flex;
  align-items:center;
  gap:11px;
}
.calendar{
  width:26px;
  height:26px;
  border:3px solid currentColor;
  border-radius:3px;
  position:relative;
  flex:0 0 auto;
}
.calendar:before{
  content:"";
  position:absolute;
  left:-3px;
  right:-3px;
  top:5px;
  border-top:3px solid currentColor;
}
.calendar:after{
  content:"";
  position:absolute;
  left:5px;
  top:-6px;
  width:3px;
  height:6px;
  background:currentColor;
  box-shadow:10px 0 0 currentColor;
}
.career .calendar{color:var(--blue)}
.school .calendar{color:var(--yellow)}
.infoDate{
  font-size:clamp(9px,.9vw,14px);
  letter-spacing:.11em;
  font-weight:650;
  white-space:nowrap;
}

/* iPadで高さが厳しい時だけ少し縮める */
@media (max-height: 820px) and (orientation:landscape){
  .page{
    padding-top:max(8px,env(safe-area-inset-top));
    padding-bottom:max(8px,env(safe-area-inset-bottom));
  }
  .hero h1{
    font-size:clamp(48px,6.2vw,90px);
  }
  .digits{
    font-size:clamp(205px,27.5vw,430px);
  }
  .dayslabel{
    margin-top:3vh;
    font-size:clamp(23px,2.8vw,44px);
  }
  .tnum{
    font-size:clamp(40px,5vw,72px);
  }
  .examdate{
    margin-top:.7vh;
  }
  .nextExam{min-height:82px}
  .bottom{min-height:78px}
}

/* 縦向きの保険 */
@media(max-width:850px) and (orientation:portrait){
  body{overflow:auto}
  .page{
    height:auto;
    min-height:100dvh;
    overflow:visible;
    grid-template-rows:auto auto auto auto;
    padding-left:20px;
    padding-right:20px;
  }
  .top{
    grid-template-columns:1fr auto;
  }
  .topline{display:none}
  .hero{
    padding:4vh 0 3vh;
  }
  .hero h1{
    font-size:clamp(42px,9vw,68px);
  }
  .digits{
    font-size:clamp(160px,39vw,310px);
  }
  .dayslabel{
    margin-top:2vh;
  }
  .tunit{min-width:86px}
  .nextExam{
    grid-template-columns:1fr;
  }
  .nextExam>.vertical{display:none}
  .nextRight{
    justify-content:flex-start;
    margin-top:10px;
  }
  .bottom{
    grid-template-columns:1fr;
  }
  .bottom>.vertical{display:none}
  .info.school{padding-left:1vw}
}
</style>
</head>

<body>
<div class="page">

  <header class="top">
    <div class="entrance">ENTRANCE EXAMINATION</div>
    <div class="topline"></div>

    <!-- clock.html を作ったらここをタップして移動 -->
    <a class="today" href="clock.html" aria-label="時計ページを開く">
      <b>TODAY</b>
      <span id="today">----</span>
    </a>
  </header>

  <main class="hero">
    <h1>高校入試まで</h1>

    <div class="daysrow">
      <div class="digits" id="mainDays">
        <span>0</span><span>0</span><span>0</span>
      </div>
      <div class="dayslabel">DAYS</div>
    </div>

    <div class="timer">
      <div class="tunit">
        <div class="tnum" id="hours">00</div>
        <div class="tlabel">HOURS</div>
      </div>

      <div class="colon">:</div>

      <div class="tunit">
        <div class="tnum" id="minutes">00</div>
        <div class="tlabel">MINUTES</div>
      </div>

      <div class="colon">:</div>

      <div class="tunit">
        <div class="tnum" id="seconds">00</div>
        <div class="tlabel">SECONDS</div>
      </div>
    </div>

    <div class="examdate">2027年3月9日（火）　8:30</div>
  </main>

  <section class="nextExam">
    <div>
      <div class="kicker">NEXT EXAM IS …</div>
      <div class="nextName" id="nextExamName">---</div>
      <div class="smallDate" id="nextExamDate">---</div>
    </div>

    <div class="vertical"></div>

    <div class="nextRight">
      <div class="nextDays" id="nextExamDays">--</div>
      <div class="nextDaysLabel" id="nextExamDaysLabel">DAYS</div>
    </div>
  </section>

  <section class="bottom">
    <div class="info career">
      <div class="kicker">NEXT CAREER</div>
      <div class="infoTitle" id="careerName">---</div>
      <div class="infoDateRow">
        <div class="calendar"></div>
        <div class="infoDate" id="careerDate">---</div>
      </div>
    </div>

    <div class="vertical"></div>

    <div class="info school">
      <div class="kicker">SCHOOL EVENT</div>
      <div class="infoTitle" id="schoolName">---</div>
      <div class="infoDateRow">
        <div class="calendar"></div>
        <div class="infoDate" id="schoolDate">---</div>
      </div>
    </div>
  </section>

</div>

<script>
(() => {
  const JST = "+09:00";
  const entrance = Date.parse("2027-03-09T08:30:00+09:00");

  const exams = [
    {name:"進級テスト", date:"2026-04-10", time:"08:30"},
    {name:"第1回実力テスト", date:"2026-04-27", time:"08:30"},
    {name:"第2回実力テスト", date:"2026-06-01", time:"08:30"},
    {name:"1学期末テスト", date:"2026-06-22", time:"08:30"},
    {name:"第3回実力テスト", date:"2026-07-06", time:"08:30"},
    {name:"第4回実力テスト", date:"2026-08-28", time:"08:30"},
    {name:"第1回基礎学力テスト", date:"2026-10-07", time:"08:30"},
    {name:"第5回実力テスト", date:"2026-10-26", time:"08:30"},
    {name:"第2回基礎学力テスト", date:"2026-11-11", time:"08:30"},
    {name:"2学期末テスト", date:"2026-11-24", time:"08:30"},
    {name:"第6回実力テスト", approx:"2026年12月上旬", sort:"2026-12-05"},
    {name:"第3回基礎学力テスト", date:"2027-01-12", time:"08:30"},
    {name:"第7回実力テスト", date:"2027-01-21", time:"08:30"},
    {name:"卒業テスト", date:"2027-02-12", time:"08:30"},
    {name:"直前テスト", date:"2027-02-24", time:"08:30"}
  ];

  const careers = [
    {name:"三者面談", date:"2026-04-20"},
    {name:"第1回進路希望調査", date:"2026-05-07"},
    {name:"三者面談（第2回進路希望調査）", date:"2026-07-09"},
    {name:"高校進学説明会①", date:"2026-10-14"},
    {name:"高校進学説明会②", date:"2026-10-15"},
    {name:"第3回進路希望調査", approx:"2026年10月下旬", sort:"2026-10-25"}
  ];

  const schoolEvents = [
    {name:"始業式", date:"2026-04-08"},
    {name:"授業参観・PTA総会", date:"2026-04-18"},
    {name:"代休", date:"2026-05-01"},
    {name:"体育祭", date:"2026-05-15"},
    {name:"代休", date:"2026-06-15"},
    {name:"終業式", date:"2026-07-17"},
    {name:"PTA奉仕作業", date:"2026-08-16"},
    {name:"始業式", date:"2026-08-27"},
    {name:"文化祭", date:"2026-09-05"},
    {name:"代休", date:"2026-09-07"},
    {name:"遠足USJ", date:"2026-10-22"},
    {name:"臨時休校", date:"2026-10-23"}
  ];

  const pad = n => String(n).padStart(2,"0");

  function parseJST(date,time="00:00"){
    return Date.parse(`${date}T${time}:00${JST}`);
  }

  function parts(diff){
    const s=Math.max(0,Math.floor(diff/1000));
    return {
      d:Math.floor(s/86400),
      h:Math.floor((s%86400)/3600),
      m:Math.floor((s%3600)/60),
      s:s%60
    };
  }

  function weekday(date){
    const d=new Date(`${date}T12:00:00+09:00`);
    return ["日","月","火","水","木","金","土"][d.getDay()];
  }

  function jpDate(date){
    const [y,m,d]=date.split("-").map(Number);
    return `${y}年${m}月${d}日（${weekday(date)}）`;
  }

  function todayKey(){
    const parts=new Intl.DateTimeFormat("en-CA",{
      timeZone:"Asia/Tokyo",
      year:"numeric",
      month:"2-digit",
      day:"2-digit"
    }).formatToParts(new Date());

    const o={};
    parts.forEach(x=>o[x.type]=x.value);
    return `${o.year}-${o.month}-${o.day}`;
  }

  function setThreeDigits(n){
    const s=String(Math.max(0,n)).padStart(3,"0").slice(-3);
    document.querySelectorAll("#mainDays span")
      .forEach((el,i)=>el.textContent=s[i]);
  }

  function nextExam(now){
    const today=todayKey();

    for(const x of exams){
      if(x.date){
        const ts=parseJST(x.date,x.time||"08:30");
        if(ts>=now) return {...x,ts,exact:true};
      }else if(x.approx && x.sort>=today){
        return {...x,exact:false};
      }
    }
    return null;
  }

  function nextCalendarItem(list){
    const today=todayKey();

    const pool=list
      .filter(x => (x.date && x.date>=today) || (x.approx && x.sort>=today))
      .sort((a,b)=>(a.date||a.sort).localeCompare(b.date||b.sort));

    return pool[0] || null;
  }

  function displayCalendarItem(item,nameEl,dateEl){
    if(!item){
      nameEl.textContent="日程未定";
      dateEl.textContent="—";
      return;
    }

    nameEl.textContent=item.name;

    if(item.date){
      dateEl.textContent=
        item.date===todayKey()
          ? `本日　${jpDate(item.date)}`
          : jpDate(item.date);
    }else{
      dateEl.textContent=item.approx;
    }
  }

  function tick(){
    const now=Date.now();
    const p=parts(entrance-now);

    setThreeDigits(p.d);
    document.getElementById("hours").textContent=pad(p.h);
    document.getElementById("minutes").textContent=pad(p.m);
    document.getElementById("seconds").textContent=pad(p.s);
    document.getElementById("today").textContent=jpDate(todayKey());

    const ex=nextExam(now);
    const name=document.getElementById("nextExamName");
    const date=document.getElementById("nextExamDate");
    const days=document.getElementById("nextExamDays");
    const label=document.getElementById("nextExamDaysLabel");

    if(ex){
      name.textContent=`${ex.name}まで`;

      if(ex.exact){
        date.textContent=jpDate(ex.date);
        days.textContent=parts(ex.ts-now).d;
        label.textContent="DAYS";
      }else{
        date.textContent=ex.approx;
        days.textContent="—";
        label.textContent="日程未確定";
      }
    }else{
      name.textContent="高校入試まで";
      date.textContent="2027年3月9日（火）";
      days.textContent=p.d;
      label.textContent="DAYS";
    }

    displayCalendarItem(
      nextCalendarItem(careers),
      document.getElementById("careerName"),
      document.getElementById("careerDate")
    );

    displayCalendarItem(
      nextCalendarItem(schoolEvents),
      document.getElementById("schoolName"),
      document.getElementById("schoolDate")
    );
  }

  tick();
  setInterval(tick,1000);
})();
</script>
</body>
</html>
