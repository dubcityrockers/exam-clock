<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f1eee4">
<title>高校入試カウントダウン</title>
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<style>
:root{
  --paper:#f1eee4; --ink:#111; --blue:#1683d8;
  --yellow:#efc400; --red:#ee202d; --line:rgba(17,17,17,.58);
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:var(--paper);color:var(--ink)}
body{overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Hiragino Sans","Yu Gothic",sans-serif}
.app{width:100vw;height:100vh;height:100dvh;overflow:hidden;touch-action:pan-y}
.track{width:300%;height:100%;display:flex;transform:translateX(0);transition:transform .42s cubic-bezier(.22,.7,.2,1)}
.track.clock-active{transform:translateX(-33.333333%)}
.track.calendar-active{transform:translateX(-66.666667%)}
.screen{width:33.333333%;height:100%;flex:0 0 33.333333%;overflow:hidden;background:var(--paper)}

/* EXAM */
.page{
  width:100%;height:100%;
  padding:max(12px,env(safe-area-inset-top)) max(24px,env(safe-area-inset-right))
          max(10px,env(safe-area-inset-bottom)) max(24px,env(safe-area-inset-left));
  display:grid;grid-template-rows:auto minmax(0,1fr) auto auto;
}
.top{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:16px;min-height:34px}
.entrance{font-size:clamp(13px,1.6vw,24px);letter-spacing:.32em;white-space:nowrap}
.topline{height:1px;background:var(--ink)}
.today{display:flex;align-items:baseline;gap:10px;white-space:nowrap}
.today b{font-size:clamp(9px,.7vw,11px);letter-spacing:.25em}
.today span{font-size:clamp(10px,.95vw,15px);letter-spacing:.1em;font-weight:650}

.hero{min-height:0;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:.3vh 0 .8vh}
.hero h1{margin:0 0 .3vh;font-size:clamp(54px,7vw,108px);line-height:.95;font-weight:850}
.daysrow{display:flex;align-items:center;justify-content:center;gap:1.3vw}
.digits{display:flex;font-size:clamp(230px,31vw,500px);line-height:.70;font-weight:900;letter-spacing:-.095em;font-variant-numeric:tabular-nums}
.digits span:nth-child(1){color:#d62828} .digits span:nth-child(2){color:#f2c300} .digits span:nth-child(3){color:#168447}
.dayslabel{margin-top:4vh;font-size:clamp(26px,3.3vw,54px);font-weight:900;letter-spacing:.16em}
.timer{margin-top:.2vh;display:flex;justify-content:center;align-items:flex-start}
.tunit{min-width:140px;text-align:center}
.tnum{font-size:clamp(46px,5.8vw,88px);line-height:.95;font-weight:850;font-variant-numeric:tabular-nums}
.colon{padding:0 16px;font-size:clamp(40px,4.5vw,72px);line-height:.95}
.tlabel{margin-top:7px;font-size:clamp(8px,.72vw,11px);letter-spacing:.38em;font-weight:800}
.examdate{margin-top:1.1vh;font-size:clamp(14px,1.45vw,22px);letter-spacing:.16em;font-weight:650}

.nextExam{border-top:1px solid var(--line);border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr 1px .72fr;align-items:center;padding:.95vh 1vw;min-height:92px}
.vertical{width:1px;height:72%;background:var(--line);justify-self:center}
.kicker{font-size:clamp(8px,.7vw,11px);letter-spacing:.33em;font-weight:850}
.nextName{margin-top:4px;font-size:clamp(23px,2.45vw,38px);line-height:1.02;font-weight:850}
.smallDate{margin-top:5px;font-size:clamp(9px,.9vw,14px);letter-spacing:.12em;font-weight:650}
.nextRight{display:flex;justify-content:flex-end;align-items:center;gap:1vw}
.nextDays{color:var(--red);font-size:clamp(66px,8vw,122px);line-height:.74;font-weight:900;letter-spacing:-.05em;font-variant-numeric:tabular-nums}
.nextDaysLabel{font-size:clamp(17px,1.75vw,28px);letter-spacing:.18em;font-weight:900}
.bottom{display:grid;grid-template-columns:1fr 1px 1fr;align-items:stretch;min-height:88px}
.info{padding:.9vh 1vw .25vh;min-width:0}.info.school{padding-left:3.2vw}
.infoTitle{margin-top:5px;font-size:clamp(19px,2vw,31px);line-height:1.05;font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.infoDateRow{margin-top:7px;display:flex;align-items:center;gap:11px}
.calendar{width:26px;height:26px;border:3px solid currentColor;border-radius:3px;position:relative;flex:0 0 auto}
.calendar:before{content:"";position:absolute;left:-3px;right:-3px;top:5px;border-top:3px solid currentColor}
.calendar:after{content:"";position:absolute;left:5px;top:-6px;width:3px;height:6px;background:currentColor;box-shadow:10px 0 0 currentColor}
.career .calendar{color:var(--blue)} .school .calendar{color:var(--yellow)}
.infoDate{font-size:clamp(9px,.9vw,14px);letter-spacing:.11em;font-weight:650;white-space:nowrap}

/* CLOCK */
.clockPage{
  width:100%;height:100%;
  padding:max(16px,env(safe-area-inset-top)) max(28px,env(safe-area-inset-right))
          max(16px,env(safe-area-inset-bottom)) max(28px,env(safe-area-inset-left));
  display:grid;grid-template-rows:auto 1fr auto;align-items:center;
}
.clockTop{display:flex;align-items:center;gap:18px}
.clockTop .label{font-size:clamp(13px,1.4vw,21px);letter-spacing:.34em;font-weight:800}
.clockTop .line{height:1px;background:var(--ink);flex:1}
.clockTop .dateText{font-size:clamp(10px,1vw,15px);letter-spacing:.12em;font-weight:650;white-space:nowrap}
.clockCenter{min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%}
.flipClock{display:flex;align-items:center;justify-content:center;gap:2vw}
.flipCard{
  position:relative;width:clamp(170px,20vw,300px);height:clamp(230px,30vh,370px);
  border-radius:18px;background:#171717;box-shadow:0 12px 24px rgba(0,0,0,.15);overflow:hidden;perspective:1000px
}
.flipCard::before{content:"";position:absolute;left:0;right:0;top:50%;border-top:2px solid #050505;z-index:6}
.flipCard::after{content:"";position:absolute;left:-6px;right:-6px;top:50%;height:10px;transform:translateY(-50%);border-left:11px solid #303030;border-right:11px solid #303030;z-index:7}
.flipNum{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:white;font-size:clamp(135px,16vw,255px);font-weight:900;letter-spacing:-.07em;font-variant-numeric:tabular-nums}
.flipNum.animate{animation:flipPulse .42s ease}
@keyframes flipPulse{0%{transform:rotateX(0)}45%{transform:rotateX(-18deg);filter:brightness(.72)}100%{transform:rotateX(0);filter:brightness(1)}}
.clockColon{font-size:clamp(64px,6vw,96px);font-weight:800}
.secondsBox{display:flex;flex-direction:column;align-items:center;gap:8px}
.seconds{color:var(--red);font-size:clamp(64px,6.5vw,104px);font-weight:900;font-variant-numeric:tabular-nums}
.secondsLabel{font-size:clamp(8px,.65vw,10px);letter-spacing:.34em;font-weight:800}

.weekdayCollage{margin-top:3vh;display:flex;align-items:flex-end;justify-content:center;gap:.22em;max-width:94vw}
.weekdayCollage span{
  display:inline-flex;align-items:center;justify-content:center;min-width:.70em;padding:.02em .09em .05em;
  line-height:.94;font-size:clamp(38px,4.25vw,68px);font-weight:900;
  transform:rotate(var(--r));color:var(--fg);background:var(--bg);font-family:var(--font);
}
.waDate{margin-top:2.2vh;font-family:"Hiragino Mincho ProN","YuMincho","Yu Mincho",serif;font-size:clamp(25px,2.7vw,43px);font-weight:900;letter-spacing:0;white-space:nowrap}
.holiday{
  margin-top:1.3vh;color:var(--red);
  font-size:clamp(17px,1.8vw,28px);font-weight:850;letter-spacing:.12em;
  min-height:1.4em;
}
.holiday:empty{display:none}

.pager{display:flex;justify-content:center;gap:26px;padding-top:.6vh}
.pagerBtn{
  appearance:none;border:0;background:transparent;color:var(--ink);
  min-width:70px;min-height:44px;padding:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:6px;font:inherit;cursor:pointer
}
.dot{width:11px;height:11px;border-radius:50%;background:#b7b7b7}
.pagerBtn.active .dot{background:var(--red)}
.pagerLabel{font-size:10px;letter-spacing:.28em;font-weight:700}

@media(max-height:820px) and (orientation:landscape){
  .hero h1{font-size:clamp(48px,6.2vw,90px)}
  .digits{font-size:clamp(205px,27.5vw,430px)}
  .dayslabel{margin-top:3vh;font-size:clamp(23px,2.8vw,44px)}
  .tnum{font-size:clamp(40px,5vw,72px)}
  .nextExam{min-height:82px}.bottom{min-height:78px}
  .flipCard{width:clamp(150px,18vw,255px);height:clamp(195px,26vh,300px)}
  .flipNum{font-size:clamp(115px,14vw,210px)}
  .weekdayCollage{margin-top:2vh}
}

/* CALENDAR */
.calendarPage{
  width:100%;height:100%;
  padding:max(16px,env(safe-area-inset-top)) max(28px,env(safe-area-inset-right))
          max(14px,env(safe-area-inset-bottom)) max(28px,env(safe-area-inset-left));
  display:grid;grid-template-rows:auto minmax(0,1fr) auto;background:var(--paper);
}
.calHeader{display:flex;align-items:flex-end;gap:2vw;border-bottom:1px solid var(--line);padding-bottom:1.2vh}
.calMonthNo{font-size:clamp(78px,9vw,142px);line-height:.72;font-weight:900;letter-spacing:-.07em}
.calMonthWords{display:flex;align-items:baseline;gap:1vw}
.calMonthName{font-size:clamp(30px,3.8vw,60px);font-weight:900;letter-spacing:.02em}
.calYear{font-size:clamp(22px,2.5vw,40px);font-weight:850;color:#bdbdb5}
.calBody{min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 24%;gap:2vw;padding-top:2vh}
.calGridWrap{min-width:0;overflow:hidden}
.calWeekdays,.calGrid{display:grid;grid-template-columns:repeat(7,1fr)}
.calWeekdays{border-bottom:1px solid var(--line)}
.calWeekday{padding:.3vh .5vw 1vh;font-size:clamp(10px,.95vw,15px);font-weight:850;letter-spacing:.08em}
.calWeekday.sun{color:#d62828}.calWeekday.sat{color:#1683d8}
.calGrid{height:calc(100% - 34px);grid-template-rows:repeat(6,1fr)}
.calCell{
  position:relative;min-height:0;border-bottom:1px solid rgba(17,17,17,.18);
  padding:.7vh .6vw;overflow:hidden;
}
.calCell:not(:nth-child(7n)){border-right:1px solid rgba(17,17,17,.12)}
.calNum{font-size:clamp(22px,2.6vw,42px);line-height:1;font-weight:850}
.calCell.sun .calNum{color:#d62828}.calCell.sat .calNum{color:#1683d8}
.calCell.out .calNum{color:#c8c8c0}
.calCell.today{background:#f0c900}
.calCell.today .calNum{color:#111}
.calEvent{
  margin-top:.6vh;font-size:clamp(8px,.72vw,11px);line-height:1.25;
  font-weight:800;white-space:normal;
}
.calEvent.exam{color:#d62828}.calEvent.career{color:#1683d8}.calEvent.school{color:#725f00}
.calSide{border-left:1px solid var(--line);padding-left:2vw;display:flex;flex-direction:column;justify-content:center}
.calSideLabel{font-size:clamp(10px,.9vw,14px);font-weight:850;letter-spacing:.28em}
.calTodayNum{font-size:clamp(105px,12vw,190px);line-height:.82;font-weight:900;letter-spacing:-.08em}
.calTodayDay{margin-top:1vh;font-size:clamp(22px,2.5vw,40px);font-weight:900;color:#1683d8}
.calTodayEvent{margin-top:2.5vh;font-size:clamp(16px,1.7vw,27px);font-weight:850;line-height:1.2}
.calHint{margin-top:2vh;font-size:clamp(8px,.72vw,11px);letter-spacing:.15em;color:#777}
.calFooter{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding-top:1vh}
.calNav{appearance:none;border:0;background:transparent;font:inherit;font-size:clamp(11px,1vw,15px);font-weight:850;letter-spacing:.18em;cursor:pointer}
.calNav.prev{text-align:left}.calNav.next{text-align:right}
.calTodayBtn{appearance:none;border:0;background:transparent;font:inherit;font-size:10px;font-weight:850;letter-spacing:.25em;cursor:pointer}
.calPager{display:flex;gap:9px;align-items:center;justify-content:center;margin-top:5px}
.calPager i{width:8px;height:8px;border-radius:50%;background:#bbb;display:block}
.calPager i.active{background:var(--red)}
.calendarPage.slideUp .calBody{animation:calUp .28s ease}
.calendarPage.slideDown .calBody{animation:calDown .28s ease}
@keyframes calUp{from{transform:translateY(40px);opacity:.25}to{transform:none;opacity:1}}
@keyframes calDown{from{transform:translateY(-40px);opacity:.25}to{transform:none;opacity:1}}


/* CLOCK SIZE FIX — restore full-screen impact */
.clockPage{
  padding:max(6px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right))
          max(6px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));
  grid-template-rows:auto minmax(0,1fr) auto;
}
.clockTop{min-height:26px;padding:0 1vw}
.clockCenter{height:100%;justify-content:space-evenly;padding:0}
.flipClock{width:100%;gap:1.2vw}
.flipCard{
  width:clamp(250px,31vw,470px);
  height:clamp(310px,46vh,540px);
  border-radius:20px;
}
.flipNum{font-size:clamp(205px,25vw,390px)}
.clockColon{font-size:clamp(72px,7vw,112px)}
.weekdayCollage{margin-top:0;max-width:96vw;gap:.18em}
.weekdayCollage span{font-size:clamp(42px,4.8vw,76px)}
.holiday{margin-top:.4vh}
.pager{padding-top:0;padding-bottom:0}

</style>
</head>
<body>
<div class="app" id="app">
  <div class="track" id="track">

    <section class="screen">
      <div class="page">
        <header class="top">
          <div class="entrance">ENTRANCE EXAMINATION</div>
          <div class="topline"></div>
          <div class="today"><b>TODAY</b><span id="today">----</span></div>
        </header>

        <main class="hero">
          <h1>高校入試まで</h1>
          <div class="daysrow">
            <div class="digits" id="mainDays"><span>0</span><span>0</span><span>0</span></div>
            <div class="dayslabel">DAYS</div>
          </div>
          <div class="timer">
            <div class="tunit"><div class="tnum" id="hours">00</div><div class="tlabel">HOURS</div></div>
            <div class="colon">:</div>
            <div class="tunit"><div class="tnum" id="minutes">00</div><div class="tlabel">MINUTES</div></div>
            <div class="colon">:</div>
            <div class="tunit"><div class="tnum" id="seconds">00</div><div class="tlabel">SECONDS</div></div>
          </div>
          <div class="examdate">2027年3月9日（火）　8:30</div>
        </main>

        <section class="nextExam">
          <div>
            <div class="kicker">NEXT EXAM IS …</div>
            <div class="nextName" id="nextExamName">---</div>
            <div class="smallDate" id="nextExamDate">---</div>
          </div>
          <div class="vertical"></div>
          <div class="nextRight">
            <div class="nextDays" id="nextExamDays">--</div>
            <div class="nextDaysLabel" id="nextExamDaysLabel">DAYS</div>
          </div>
        </section>

        <section class="bottom">
          <div class="info career">
            <div class="kicker">NEXT CAREER</div>
            <div class="infoTitle" id="careerName">---</div>
            <div class="infoDateRow"><div class="calendar"></div><div class="infoDate" id="careerDate">---</div></div>
          </div>
          <div class="vertical"></div>
          <div class="info school">
            <div class="kicker">SCHOOL EVENT</div>
            <div class="infoTitle" id="schoolName">---</div>
            <div class="infoDateRow"><div class="calendar"></div><div class="infoDate" id="schoolDate">---</div></div>
          </div>
        </section>
      </div>
    </section>

    <section class="screen">
      <div class="clockPage">
        <header class="clockTop">
          <div class="label">TODAY</div>
          <div class="line"></div>
          <div class="dateText" id="clockTopDate">----</div>
        </header>

        <main class="clockCenter">
          <div class="flipClock">
            <div class="flipCard"><div class="flipNum" id="hourNum">00</div></div>
            <div class="clockColon">:</div>
            <div class="flipCard"><div class="flipNum" id="minuteNum">00</div></div>
          </div>

          <div class="weekdayCollage" id="weekdayCollage"></div>
          <div class="waDate" id="waDate">----</div>
          <div class="holiday" id="holidayName"></div>
        </main>

        <nav class="pager">
          <button type="button" class="pagerBtn active" id="examBtn"><span class="dot"></span><span class="pagerLabel">EXAM</span></button>
          <button type="button" class="pagerBtn" id="clockBtn"><span class="dot"></span><span class="pagerLabel">CLOCK</span></button>
        </nav>
      </div>
    </section>


    <section class="screen">
      <div class="calendarPage" id="calendarPage">
        <header class="calHeader">
          <div class="calMonthNo" id="calMonthNo">09</div>
          <div class="calMonthWords">
            <div class="calMonthName" id="calMonthName">SEPTEMBER</div>
            <div class="calYear" id="calYear">2026</div>
          </div>
        </header>
        <main class="calBody">
          <div class="calGridWrap">
            <div class="calWeekdays">
              <div class="calWeekday sun">SUN</div><div class="calWeekday">MON</div><div class="calWeekday">TUE</div>
              <div class="calWeekday">WED</div><div class="calWeekday">THU</div><div class="calWeekday">FRI</div>
              <div class="calWeekday sat">SAT</div>
            </div>
            <div class="calGrid" id="calGrid"></div>
          </div>
          <aside class="calSide">
            <div class="calSideLabel">TODAY</div>
            <div class="calTodayNum" id="calTodayNum">05</div>
            <div class="calTodayDay" id="calTodayDay">SATURDAY</div>
            <div class="calTodayEvent" id="calTodayEvent"></div>
            <div class="calHint">↑ NEXT MONTH<br>↓ PREVIOUS MONTH</div>
          </aside>
        </main>
        <footer class="calFooter">
          <button class="calNav prev" id="prevMonth">← AUGUST</button>
          <div>
            <button class="calTodayBtn" id="calTodayBtn">TODAY</button>
            <div class="calPager"><i></i><i></i><i class="active"></i></div>
          </div>
          <button class="calNav next" id="nextMonth">OCTOBER →</button>
        </footer>
      </div>
    </section>
  </div>
</div>

<script>
(() => {
  const JST="+09:00";
  const entrance=Date.parse("2027-03-09T08:30:00+09:00");
  const app=document.getElementById("app"), track=document.getElementById("track");
  const examBtn=document.getElementById("examBtn"), clockBtn=document.getElementById("clockBtn");
  let page=0,startX=0,startY=0,dragging=false,prevMinute=null,prevHour=null,prevWeekday="";

  const exams=[
    {name:"第1回基礎学力テスト",date:"2026-10-07",time:"08:30"},

    {name:"第3回進路希望調査",approx:"2026年10月下旬",sort:"2026-10-25"}

  // 内閣府公表の2026年・2027年の国民の祝日／休日
  const holidays={
    "2026-01-01":"元日","2026-01-12":"成人の日","2026-02-11":"建国記念の日",
    "2026-02-23":"天皇誕生日","2026-03-20":"春分の日","2026-04-29":"昭和の日",
    "2026-05-03":"憲法記念日","2026-05-04":"みどりの日","2026-05-05":"こどもの日",

    "2026-10-12":"スポーツの日","2026-11-03":"文化の日","2026-11-23":"勤労感謝の日",
    "2027-01-01":"元日","2027-01-11":"成人の日","2027-02-11":"建国記念の日",
    "2027-02-23":"天皇誕生日","2027-03-21":"春分の日","2027-03-22":"休日",
    "2027-04-29":"昭和の日","2027-05-03":"憲法記念日","2027-05-04":"みどりの日",
    "2027-05-05":"こどもの日","2027-07-19":"海の日","2027-08-11":"山の日",
    "2027-09-20":"敬老の日","2027-09-23":"秋分の日","2027-10-11":"スポーツの日",
    "2027-11-03":"文化の日","2027-11-23":"勤労感謝の日"
  };

  const weekdayEN=["SUNDAY","MONDAY","TUESDAY","WEDNESDAY","THURSDAY","FRIDAY","SATURDAY"];
  const collageStyles=[
    {bg:"#efe6d0",fg:"#111",font:"Georgia,serif",r:"-3deg"},
    {bg:"#f4f0e7",fg:"#e62a20",font:"Arial Black,sans-serif",r:"2deg"},
    {bg:"#2d5e91",fg:"#fff",font:"Impact,sans-serif",r:"-1deg"},
    {bg:"#e8b92d",fg:"#111",font:"Georgia,serif",r:"1deg"},
    {bg:"#e9e2cf",fg:"#207a73",font:"Times New Roman,serif",r:"-2deg"},
    {bg:"#d9d9d3",fg:"#111",font:"Impact,sans-serif",r:"2deg"},
    {bg:"#d92b21",fg:"#fff",font:"Georgia,serif",r:"-1deg"},
    {bg:"#eadfc8",fg:"#111",font:"Times New Roman,serif",r:"2deg"},
    {bg:"#111",fg:"#fff",font:"Arial Black,sans-serif",r:"-2deg"}
  ];

  const pad=n=>String(n).padStart(2,"0");

  function jstParts(){
    const f=new Intl.DateTimeFormat("en-US",{
      timeZone:"Asia/Tokyo",year:"numeric",month:"2-digit",day:"2-digit",
      hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false
    }).formatToParts(new Date());
    const o={}; f.forEach(x=>o[x.type]=x.value); return o;
  }
  function todayKey(){const o=jstParts();return `${o.year}-${o.month}-${o.day}`}
  function weekday(date){return ["日","月","火","水","木","金","土"][new Date(`${date}T12:00:00+09:00`).getDay()]}
  function jpDate(date){const [y,m,d]=date.split("-").map(Number);return `${y}年${m}月${d}日（${weekday(date)}）`}
  function parseJST(date,time="00:00"){return Date.parse(`${date}T${time}:00${JST}`)}
  function parts(diff){const s=Math.max(0,Math.floor(diff/1000));return {d:Math.floor(s/86400),h:Math.floor((s%86400)/3600),m:Math.floor((s%3600)/60),s:s%60}}
  function setThreeDigits(n){const s=String(Math.max(0,n)).padStart(3,"0").slice(-3);document.querySelectorAll("#mainDays span").forEach((el,i)=>el.textContent=s[i])}

  function nextExam(now){
    const today=todayKey();
    for(const x of exams){
      if(x.date){const ts=parseJST(x.date,x.time||"08:30");if(ts>=now)return {...x,ts,exact:true}}
      else if(x.approx && x.sort>=today)return {...x,exact:false};
    }
    return null;
  }
  function nextCalendarItem(list){
    const today=todayKey();
    return list.filter(x=>(x.date&&x.date>=today)||(x.approx&&x.sort>=today))
      .sort((a,b)=>(a.date||a.sort).localeCompare(b.date||b.sort))[0]||null;
  }
  function displayCalendarItem(item,nameEl,dateEl){
    if(!item){nameEl.textContent="日程未定";dateEl.textContent="—";return}
    nameEl.textContent=item.name;
    dateEl.textContent=item.date?(item.date===todayKey()?`本日　${jpDate(item.date)}`:jpDate(item.date)):item.approx;
  }
  function animateFlip(el){el.classList.remove("animate");void el.offsetWidth;el.classList.add("animate")}
  function renderWeekday(word){
    const root=document.getElementById("weekdayCollage");root.innerHTML="";
    [...word].forEach((ch,i)=>{
      const s=collageStyles[i%collageStyles.length],span=document.createElement("span");
      span.textContent=ch;span.style.setProperty("--bg",s.bg);span.style.setProperty("--fg",s.fg);
      span.style.setProperty("--font",s.font);span.style.setProperty("--r",s.r);root.appendChild(span);
    });
  }
  function setPage(next){
    page=Math.max(0,Math.min(2,next));
    track.classList.toggle("clock-active",page===1);
    track.classList.toggle("calendar-active",page===2);
    examBtn.classList.toggle("active",page===0);
    clockBtn.classList.toggle("active",page===1);
  }

  function tick(){
    const now=Date.now(), p=parts(entrance-now);
    setThreeDigits(p.d);
    document.getElementById("hours").textContent=pad(p.h);
    document.getElementById("minutes").textContent=pad(p.m);
    document.getElementById("seconds").textContent=pad(p.s);
    document.getElementById("today").textContent=jpDate(todayKey());

    const ex=nextExam(now);
    if(ex){
      document.getElementById("nextExamName").textContent=`${ex.name}まで`;
      if(ex.exact){
        document.getElementById("nextExamDate").textContent=jpDate(ex.date);
        document.getElementById("nextExamDays").textContent=parts(ex.ts-now).d;
        document.getElementById("nextExamDaysLabel").textContent="DAYS";
      }else{
        document.getElementById("nextExamDate").textContent=ex.approx;
        document.getElementById("nextExamDays").textContent="—";
        document.getElementById("nextExamDaysLabel").textContent="日程未確定";
      }
    }

    displayCalendarItem(nextCalendarItem(careers),document.getElementById("careerName"),document.getElementById("careerDate"));
    displayCalendarItem(nextCalendarItem(schoolEvents),document.getElementById("schoolName"),document.getElementById("schoolDate"));

    const t=jstParts(), hour=pad(Number(t.hour)%24), minute=pad(Number(t.minute)), second=pad(Number(t.second));
    const hourEl=document.getElementById("hourNum"), minuteEl=document.getElementById("minuteNum");
    if(prevHour!==null && hour!==prevHour)animateFlip(hourEl);
    if(prevMinute!==null && minute!==prevMinute)animateFlip(minuteEl);
    hourEl.textContent=hour;minuteEl.textContent=minute;
    prevHour=hour;prevMinute=minute;

    const key=`${t.year}-${t.month}-${t.day}`;
    const w=weekdayEN[new Date(`${key}T12:00:00+09:00`).getDay()];
    if(w!==prevWeekday){renderWeekday(w);prevWeekday=w}
    const kanjiDigits={"0":"〇","1":"一","2":"二","3":"三","4":"四","5":"五","6":"六","7":"七","8":"八","9":"九"};
    const yearKanji=[...t.year].map(n=>kanjiDigits[n]).join("");
    const monthNames=["睦月","如月","弥生","卯月","皐月","水無月","文月","葉月","長月","神無月","霜月","師走"];
    const dayKanji=n=>{
      n=Number(n);
      if(n<=10)return ["","一","二","三","四","五","六","七","八","九","十"][n];
      if(n<20)return "十"+["","一","二","三","四","五","六","七","八","九"][n-10];
      if(n===20)return "二十";
      if(n<30)return "二十"+["","一","二","三","四","五","六","七","八","九"][n-20];
      if(n===30)return "三十";
      return "三十一";
    };
    const jpWeek=["日曜日","月曜日","火曜日","水曜日","木曜日","金曜日","土曜日"][new Date(`${key}T12:00:00+09:00`).getDay()];
    document.getElementById("waDate").textContent=`${yearKanji}年${monthNames[Number(t.month)-1]}${dayKanji(t.day)}日${jpWeek}`;
    document.getElementById("clockTopDate").textContent=jpDate(key);
    document.getElementById("holidayName").textContent=holidays[key]||"";
  }

  examBtn.addEventListener("click",()=>setPage(0));
  clockBtn.addEventListener("click",()=>setPage(1));
  app.addEventListener("pointerdown",e=>{if(e.pointerType==="mouse"&&e.button!==0)return;startX=e.clientX;startY=e.clientY;dragging=true});
  app.addEventListener("pointerup",e=>{
    if(!dragging)return;dragging=false;
    const dx=e.clientX-startX,dy=e.clientY-startY;
    if(page===2 && Math.abs(dy)>55 && Math.abs(dy)>Math.abs(dx)*1.15){
      changeMonth(dy<0?1:-1);
      return;
    }
    if(Math.abs(dx)>55 && Math.abs(dx)>Math.abs(dy)*1.15){
      if(dx<0) setPage(Math.min(2,page+1));
      else setPage(Math.max(0,page-1));
    }
  });
  app.addEventListener("pointercancel",()=>dragging=false);


  const monthNames=["JANUARY","FEBRUARY","MARCH","APRIL","MAY","JUNE","JULY","AUGUST","SEPTEMBER","OCTOBER","NOVEMBER","DECEMBER"];
  let calView=null;

  function todayDateJST(){
    const t=jstParts();
    return {y:Number(t.year),m:Number(t.month)-1,d:Number(t.day),key:`${t.year}-${t.month}-${t.day}`};
  }
  function keyOf(y,m,d){return `${y}-${pad(m+1)}-${pad(d)}`}
  function eventsForDate(key){
    const found=[];
    exams.forEach(x=>{if(x.date===key)found.push({name:x.name,type:"exam"})});
    careers.forEach(x=>{if(x.date===key)found.push({name:x.name,type:"career"})});
    schoolEvents.forEach(x=>{if(x.date===key)found.push({name:x.name,type:"school"})});
    if(holidays[key])found.push({name:holidays[key],type:"exam"});
    return found;
  }
  function renderCalendar(anim){
    if(!calView){const t=todayDateJST();calView={y:t.y,m:t.m}}
    const y=calView.y,m=calView.m,t=todayDateJST();
    document.getElementById("calMonthNo").textContent=pad(m+1);
    document.getElementById("calMonthName").textContent=monthNames[m];
    document.getElementById("calYear").textContent=y;

    const grid=document.getElementById("calGrid");grid.innerHTML="";
    const first=new Date(Date.UTC(y,m,1)).getUTCDay();
    const days=new Date(Date.UTC(y,m+1,0)).getUTCDate();
    const prevDays=new Date(Date.UTC(y,m,0)).getUTCDate();

    for(let i=0;i<42;i++){
      let cy=y,cm=m,day,out=false;
      if(i<first){day=prevDays-first+i+1;cm=m-1;out=true}
      else if(i>=first+days){day=i-first-days+1;cm=m+1;out=true}
      else day=i-first+1;
      if(cm<0){cm=11;cy--} if(cm>11){cm=0;cy++}
      const key=keyOf(cy,cm,day),dow=i%7;
      const cell=document.createElement("div");
      cell.className="calCell"+(dow===0?" sun":"")+(dow===6?" sat":"")+(out?" out":"")+(key===t.key?" today":"");
      const num=document.createElement("div");num.className="calNum";num.textContent=day;cell.appendChild(num);
      if(!out){
        eventsForDate(key).slice(0,2).forEach(ev=>{
          const el=document.createElement("div");el.className=`calEvent ${ev.type}`;el.textContent=ev.name;cell.appendChild(el);
        });
      }
      grid.appendChild(cell);
    }

    document.getElementById("calTodayNum").textContent=pad(t.d);
    document.getElementById("calTodayDay").textContent=weekdayEN[new Date(`${t.key}T12:00:00+09:00`).getDay()];
    document.getElementById("calTodayEvent").textContent=eventsForDate(t.key).map(e=>e.name).join(" / ");

    const pm=new Date(Date.UTC(y,m-1,1)),nm=new Date(Date.UTC(y,m+1,1));
    document.getElementById("prevMonth").textContent=`← ${monthNames[pm.getUTCMonth()]}`;
    document.getElementById("nextMonth").textContent=`${monthNames[nm.getUTCMonth()]} →`;

    if(anim){
      const cp=document.getElementById("calendarPage");
      cp.classList.remove("slideUp","slideDown");void cp.offsetWidth;
      cp.classList.add(anim>0?"slideUp":"slideDown");
    }
  }
  function changeMonth(delta){
    if(!calView){const t=todayDateJST();calView={y:t.y,m:t.m}}
    calView.m+=delta;
    if(calView.m>11){calView.m=0;calView.y++}
    if(calView.m<0){calView.m=11;calView.y--}
    renderCalendar(delta);
  }
  document.getElementById("prevMonth").addEventListener("click",()=>changeMonth(-1));
  document.getElementById("nextMonth").addEventListener("click",()=>changeMonth(1));
  document.getElementById("calTodayBtn").addEventListener("click",()=>{
    const t=todayDateJST();calView={y:t.y,m:t.m};renderCalendar(0);
  });
  // Swipe left from CLOCK to CALENDAR.
  clockBtn.addEventListener("dblclick",()=>setPage(2));
  renderCalendar(0);

  tick();
  setInterval(tick,1000);
})();
</script>
</body>
</html>
