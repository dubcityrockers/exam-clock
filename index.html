<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>TIME / DATE / WEATHER</title>
<style>
:root{
  --bg:#efede6;
  --ink:#11110f;
  --muted:#77736b;
  --line:#cfcac0;
  --warm:#d95d35;
  --cool:#2f78a8;
  --sun:#e5ad17;
  --rain:#4f87b7;
  --panel:#f7f5ef;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink)}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,"Hiragino Sans","Yu Gothic",sans-serif;
  letter-spacing:.01em;
}
.app{
  width:100vw;height:100dvh;
  padding:max(28px,env(safe-area-inset-top)) max(34px,env(safe-area-inset-right))
          max(24px,env(safe-area-inset-bottom)) max(34px,env(safe-area-inset-left));
  display:grid;
  grid-template-rows:auto auto 1fr auto;
  gap:0;
}
.rule{height:1px;background:var(--line);margin:16px 0 14px}
.kicker{
  font-weight:800;font-size:clamp(13px,1.2vw,18px);letter-spacing:.04em;
}
.small{font-size:clamp(11px,1vw,15px);color:var(--muted)}
.timeRow{display:grid;grid-template-columns:1fr auto;align-items:start}
.time{
  font-size:clamp(84px,13.2vw,184px);
  line-height:.86;
  font-weight:700;
  letter-spacing:-.065em;
  font-variant-numeric:tabular-nums;
  white-space:nowrap;
}
.jst{padding-top:5px;font-size:clamp(14px,1.4vw,21px);font-weight:700}
.dateRow{display:grid;grid-template-columns:1fr 1fr;gap:34px;align-items:end}
.weekday{
  font-size:clamp(30px,3vw,54px);
  line-height:1;font-weight:700;letter-spacing:.015em
}
.dateMain{
  font-size:clamp(34px,4.1vw,72px);
  line-height:.95;font-weight:650;letter-spacing:-.025em;
}
.year{
  font-size:clamp(22px,2.1vw,36px);font-weight:650;margin-top:4px
}
.weatherHead{
  display:flex;justify-content:space-between;align-items:center;margin-bottom:14px
}
.weatherGrid{
  display:grid;
  grid-template-columns:1.12fr .92fr .96fr;
  min-height:0;
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
}
.block{padding:20px 24px;min-width:0}
.block + .block{border-left:1px solid var(--line)}
.condition{
  display:flex;align-items:center;gap:20px;margin:6px 0 18px
}
.wxIcon{
  width:92px;height:76px;display:grid;place-items:center;
  font-size:58px;line-height:1
}
.conditionText{
  font-size:clamp(24px,2.4vw,42px);font-weight:650;line-height:1.2
}
.temps{
  display:grid;grid-template-columns:1fr 1fr 1fr;align-items:end;gap:18px
}
.tempNum{
  font-size:clamp(45px,5.7vw,90px);line-height:.9;font-weight:700;letter-spacing:-.05em;
  font-variant-numeric:tabular-nums;
}
.high{color:var(--warm)} .low{color:var(--cool)}
.tempLabel{font-size:12px;letter-spacing:.12em;margin-top:8px}
.rainBig{
  font-size:clamp(40px,4.3vw,70px);font-weight:700;line-height:.95;
  font-variant-numeric:tabular-nums;
}
.rainTitle{font-weight:700;font-size:14px;margin-bottom:8px}
.periods{
  display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin-top:8px
}
.period{text-align:center;padding:10px 8px}
.period + .period{border-left:1px solid var(--line)}
.period .range{font-size:clamp(13px,1.2vw,18px);font-weight:650}
.period .pct{font-size:clamp(28px,3.2vw,52px);font-weight:700;margin-top:10px;font-variant-numeric:tabular-nums}
.weekly{
  display:grid;grid-template-columns:repeat(7,1fr);gap:0;margin-top:6px
}
.day{text-align:center;padding:8px 6px;min-width:0}
.day + .day{border-left:1px solid var(--line)}
.day .dow{font-weight:750;font-size:clamp(12px,1.1vw,17px)}
.day .icon{font-size:clamp(24px,2.8vw,40px);line-height:1.15;margin:7px 0}
.day .hl{font-size:clamp(13px,1.25vw,18px);font-weight:650;white-space:nowrap}
.day .rp{font-size:clamp(12px,1.1vw,16px);color:var(--muted);margin-top:5px}
.footer{display:flex;justify-content:space-between;align-items:end;padding-top:12px}
.status{font-size:11px;color:var(--muted);letter-spacing:.08em}

@media (orientation:portrait){
  .app{
    padding:max(28px,env(safe-area-inset-top)) max(28px,env(safe-area-inset-right))
            max(24px,env(safe-area-inset-bottom)) max(28px,env(safe-area-inset-left));
    grid-template-rows:auto auto 1fr auto;
  }
  .time{
    font-size:clamp(78px,18.2vw,150px);
    letter-spacing:-.07em;
  }
  .jst{font-size:16px}
  .dateRow{grid-template-columns:1fr;gap:6px}
  .weekday{font-size:clamp(31px,6.2vw,48px)}
  .dateMain{font-size:clamp(40px,8.3vw,64px)}
  .year{font-size:clamp(25px,4.8vw,36px)}
  .rule{margin:13px 0 12px}
  .weatherHead{margin-bottom:8px}
  .weatherGrid{
    grid-template-columns:1fr;
    grid-template-rows:auto auto auto;
    border-top:1px solid var(--line);
  }
  .block{padding:14px 8px}
  .block + .block{border-left:0;border-top:1px solid var(--line)}
  .condition{gap:14px;margin:2px 0 12px}
  .wxIcon{width:72px;height:60px;font-size:48px}
  .conditionText{font-size:clamp(25px,5.4vw,38px)}
  .temps{gap:14px}
  .tempNum{font-size:clamp(46px,11vw,76px)}
  .rainBig{font-size:clamp(42px,9.4vw,64px)}
  .period .pct{font-size:clamp(27px,6.5vw,44px)}
  .weekly{grid-template-columns:repeat(7,1fr)}
  .day{padding:7px 2px}
  .day .dow{font-size:clamp(10px,2vw,14px)}
  .day .icon{font-size:clamp(20px,4.4vw,30px)}
  .day .hl{font-size:clamp(10px,2.1vw,14px)}
  .day .rp{font-size:clamp(9px,1.9vw,13px)}
  .footer{padding-top:9px}
}
@media (max-height:700px) and (orientation:landscape){
  .app{padding-top:20px;padding-bottom:16px}
  .time{font-size:clamp(70px,11vw,140px)}
  .rule{margin:10px 0}
  .block{padding-top:13px;padding-bottom:13px}
}
</style>
</head>
<body>
<main class="app">
  <section>
    <div class="timeRow">
      <div>
        <div class="kicker">TIME</div>
        <div class="time" id="time">10:47:32</div>
      </div>
      <div class="jst">JST</div>
    </div>
    <div class="rule"></div>
    <div class="dateRow">
      <div>
        <div class="kicker">DATE</div>
        <div class="weekday" id="weekday">MONDAY</div>
      </div>
      <div>
        <div class="dateMain" id="dateMain">SEPTEMBER 07</div>
        <div class="year" id="year">2026</div>
      </div>
    </div>
    <div class="rule"></div>
  </section>

  <section class="weatherHead">
    <div class="kicker">WEATHER</div>
    <div class="kicker">徳島県北部</div>
  </section>

  <section class="weatherGrid">
    <div class="block">
      <div class="condition">
        <div class="wxIcon" id="wxIcon">☀️</div>
        <div class="conditionText" id="conditionText">読み込み中</div>
      </div>
      <div class="temps">
        <div>
          <div class="tempNum high" id="high">--°</div>
          <div class="tempLabel">HIGH</div>
        </div>
        <div>
          <div class="tempNum low" id="low">--°</div>
          <div class="tempLabel">LOW</div>
        </div>
        <div>
          <div class="rainTitle">降水確率</div>
          <div class="rainBig" id="rainToday">--%</div>
        </div>
      </div>
    </div>

    <div class="block">
      <div class="kicker">時間帯ごとの降水確率</div>
      <div class="periods">
        <div class="period"><div class="range">06–12</div><div class="pct" id="r1">--%</div></div>
        <div class="period"><div class="range">12–18</div><div class="pct" id="r2">--%</div></div>
        <div class="period"><div class="range">18–24</div><div class="pct" id="r3">--%</div></div>
      </div>
    </div>

    <div class="block">
      <div class="kicker">週間天気予報</div>
      <div class="weekly" id="weekly"></div>
    </div>
  </section>

  <footer class="footer">
    <div class="status">TOKUSHIMA NORTH · JAPAN</div>
    <div class="status" id="updated">WEATHER LOADING</div>
  </footer>
</main>

<script>
const TZ = "Asia/Tokyo";
const LAT = 34.14;   // 徳島県北部の代表点（板野周辺）
const LON = 134.47;

const WDAY_EN = ["SUNDAY","MONDAY","TUESDAY","WEDNESDAY","THURSDAY","FRIDAY","SATURDAY"];
const WDAY_JA = ["日","月","火","水","木","金","土"];
const MONTH_EN = ["JANUARY","FEBRUARY","MARCH","APRIL","MAY","JUNE","JULY","AUGUST","SEPTEMBER","OCTOBER","NOVEMBER","DECEMBER"];

function jstParts(){
  const parts = new Intl.DateTimeFormat("en-CA",{
    timeZone:TZ,year:"numeric",month:"2-digit",day:"2-digit",
    hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false,weekday:"short"
  }).formatToParts(new Date());
  const o={}; for(const p of parts) o[p.type]=p.value;
  return o;
}
function tick(){
  const p=jstParts();
  document.getElementById("time").textContent=`${p.hour}:${p.minute}:${p.second}`;
  const d = new Date(`${p.year}-${p.month}-${p.day}T12:00:00+09:00`);
  document.getElementById("weekday").textContent=WDAY_EN[d.getDay()];
  document.getElementById("dateMain").textContent=`${MONTH_EN[d.getMonth()]} ${String(d.getDate()).padStart(2,"0")}`;
  document.getElementById("year").textContent=d.getFullYear();
}
tick(); setInterval(tick,1000);

function codeInfo(code){
  if(code===0) return ["☀️","晴れ"];
  if([1,2].includes(code)) return ["🌤️","晴れ時々くもり"];
  if(code===3) return ["☁️","くもり"];
  if([45,48].includes(code)) return ["🌫️","霧"];
  if([51,53,55,56,57].includes(code)) return ["🌦️","霧雨"];
  if([61,63,65,66,67,80,81,82].includes(code)) return ["🌧️","雨"];
  if([71,73,75,77,85,86].includes(code)) return ["🌨️","雪"];
  if([95,96,99].includes(code)) return ["⛈️","雷雨"];
  return ["☁️","くもり"];
}
function maxInWindow(times, vals, day, startH, endH){
  let arr=[];
  for(let i=0;i<times.length;i++){
    if(!times[i].startsWith(day+"T")) continue;
    const h=Number(times[i].slice(11,13));
    if(h>=startH && h<endH && Number.isFinite(vals[i])) arr.push(vals[i]);
  }
  return arr.length ? Math.max(...arr) : null;
}
async function loadWeather(){
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}`+
    `&timezone=Asia%2FTokyo&forecast_days=7`+
    `&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max`+
    `&hourly=precipitation_probability`;
  try{
    const res=await fetch(url,{cache:"no-store"});
    if(!res.ok) throw new Error("weather http "+res.status);
    const w=await res.json();

    const today=w.daily.time[0];
    const [ico,txt]=codeInfo(w.daily.weather_code[0]);
    document.getElementById("wxIcon").textContent=ico;
    document.getElementById("conditionText").textContent=txt;
    document.getElementById("high").textContent=Math.round(w.daily.temperature_2m_max[0])+"°";
    document.getElementById("low").textContent=Math.round(w.daily.temperature_2m_min[0])+"°";
    document.getElementById("rainToday").textContent=Math.round(w.daily.precipitation_probability_max[0] ?? 0)+"%";

    const r1=maxInWindow(w.hourly.time,w.hourly.precipitation_probability,today,6,12);
    const r2=maxInWindow(w.hourly.time,w.hourly.precipitation_probability,today,12,18);
    const r3=maxInWindow(w.hourly.time,w.hourly.precipitation_probability,today,18,24);
    document.getElementById("r1").textContent=(r1??0)+"%";
    document.getElementById("r2").textContent=(r2??0)+"%";
    document.getElementById("r3").textContent=(r3??0)+"%";

    const weekly=document.getElementById("weekly");
    weekly.innerHTML="";
    for(let i=0;i<Math.min(7,w.daily.time.length);i++){
      const dt=new Date(w.daily.time[i]+"T12:00:00+09:00");
      const [di]=codeInfo(w.daily.weather_code[i]);
      const div=document.createElement("div");
      div.className="day";
      div.innerHTML=
        `<div class="dow">${dt.getMonth()+1}/${dt.getDate()}<br>${WDAY_JA[dt.getDay()]}</div>`+
        `<div class="icon">${di}</div>`+
        `<div class="hl">${Math.round(w.daily.temperature_2m_max[i])}° / ${Math.round(w.daily.temperature_2m_min[i])}°</div>`+
        `<div class="rp">${Math.round(w.daily.precipitation_probability_max[i] ?? 0)}%</div>`;
      weekly.appendChild(div);
    }
    const now=new Intl.DateTimeFormat("ja-JP",{timeZone:TZ,hour:"2-digit",minute:"2-digit"}).format(new Date());
    document.getElementById("updated").textContent="UPDATED "+now;
  }catch(e){
    console.error(e);
    document.getElementById("conditionText").textContent="天気情報を取得できません";
    document.getElementById("updated").textContent="WEATHER OFFLINE";
  }
}
loadWeather();
setInterval(loadWeather,15*60*1000);
</script>
</body>
</html>
